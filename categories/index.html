  (function () {
    var COLORS = { light: "#f7f8f9", dark: "#15171c" };
    function sync() {
      var t = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", COLORS[t]); });
    }
    sync();
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    document.addEventListener("DOMContentLoaded", sync);
  })();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        
        let menuScrollTimeout;
        menu.addEventListener("scroll", function () {
            clearTimeout(menuScrollTimeout);
            menuScrollTimeout = setTimeout(function () {
                localStorage.setItem("menu-scroll-position", menu.scrollLeft);
            }, 150);
        }, { passive: true });
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            const target = document.querySelector(`[id='${decodeURIComponent(id)}']`);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                target.scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                target.scrollIntoView();
            }
            
            
            if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) {
                target.setAttribute("tabindex", "-1");
            }
            target.focus({ preventScroll: true });
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    var scrollTicking = false;
    
    window.addEventListener("scroll", function () {
        if (scrollTicking) {
            return;
        }
        scrollTicking = true;
        requestAnimationFrame(function () {
            const scrollThreshold = window.innerHeight;
            const shown = document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold;
            toplink.classList.toggle("hidden", !shown);
            scrollTicking = false;
        });
    }, { passive: true });

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
